# Explicit Local Development Configuration
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# This file enables:
# 1. Local builds from source code
# 2. Volume mounts for hot-reloading (changes on disk reflect in container)
# 3. Uvicorn --reload for the API
# 4. Local storage profiles (Postgres, Redis, etc.) by default

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    # Overriding command to enable hot-reload
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./api/src:/app

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    volumes:
      - ./worker/src:/app

  ui:
    build:
      context: ./ui/datastrat_ui
      dockerfile: Dockerfile
    command: npm run dev
    volumes:
      - ./ui/datastrat_ui:/app
      - /app/node_modules

  zitadel_init:
    build:
      context: ./zitadel
      dockerfile: Dockerfile
    volumes:
      - ./zitadel/init.py:/app/init.py:ro

  db_init:
    build:
      context: ./database
      dockerfile: Dockerfile

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # Automatically start local storage containers during local development
  postgres:
    profiles: []

  redis:
    profiles: []

  qdrant:
    profiles: []

  minio:
    profiles: []

  minio_init:
    profiles: []
