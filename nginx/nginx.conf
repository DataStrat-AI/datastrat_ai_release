# Protocol mapping - driven by deploy.sh snippets
# If headers.map is missing, it will fallback to the default below
include /etc/nginx/conf.d/headers.map*;

# Default mapping if headers.map was not included or didn't define $pref_proto
# We use 'map_hash_bucket_size' or similar if needed, but here we just ensure 
# $pref_proto is at least defined.
# NOTE: Nginx doesn't allow 'default' if the variable is already mapped.
# So we will move the entire map into the snippet.

# Increase timeout for long-running requests
proxy_read_timeout 300;
proxy_connect_timeout 300;
proxy_send_timeout 300;

# Allow large file uploads
client_max_body_size 60M;

# Upstream services (Docker service names)
upstream datastrat_ui {
    server ui:3000;
}

upstream datastrat_api {
    server api:8000;
}

upstream datastrat_zitadel {
    server zitadel:8080;
}

upstream datastrat_grafana {
    server grafana:3000;
}

# Optional SSL server block
include /etc/nginx/conf.d/ssl.conf*;

# Auth server - captures 'auth.' subdomains for Zitadel
server {
    listen 80;
    server_name ~^auth\.;

    location / {
        proxy_pass http://datastrat_zitadel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pref_proto;
        
        # Zitadel recommended headers
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}

# Local Development Auth server (Fallback for localhost:8080)
server {
    listen 8080;
    server_name localhost;

    location / {
        proxy_pass http://datastrat_zitadel;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pref_proto;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}

# Main Application server (default fallback)
server {
    listen 80 default_server;
    server_name _;

    # UI - Main application
    location / {
        proxy_pass http://datastrat_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pref_proto;
        
        # WebSocket support for Next.js
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API - Backend REST API
    location /api/ {
        proxy_pass http://datastrat_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pref_proto;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # CORS headers
        add_header 'Access-Control-Allow-Origin' "$http_origin" always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Grafana Logging & Observability Dashboard
    location /grafana/ {
        proxy_pass http://datastrat_grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pref_proto;
        
        # WebSocket support for live log tailing
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

